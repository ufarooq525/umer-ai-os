{{- if .Values.apps.controlApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "umer.fullname" . }}-control-api
  labels:
    {{- include "umer.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
spec:
  replicas: {{ .Values.apps.controlApi.replicas }}
  selector:
    matchLabels:
      {{- include "umer.selectorLabels" (dict "component" "control-api" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "umer.selectorLabels" (dict "component" "control-api" "Release" .Release) | nindent 8 }}
    spec:
      containers:
        - name: control-api
          image: {{ include "umer.image" (dict "root" . "image" .Values.apps.controlApi.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.apps.controlApi.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "umer.fullname" . }}-env
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "umer.fullname" . }}-control-api
  labels:
    {{- include "umer.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
spec:
  type: ClusterIP
  selector:
    {{- include "umer.selectorLabels" (dict "component" "control-api" "Release" .Release) | nindent 4 }}
  ports:
    - port: {{ .Values.apps.controlApi.servicePort }}
      targetPort: http
      name: http
{{- end }}
