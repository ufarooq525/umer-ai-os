apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "umer.fullname" . }}-agent
  labels:
    {{- include "umer.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
---
{{- if .Values.networkPolicy.agentEgressRestrict }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "umer.fullname" . }}-agent-egress
  labels:
    {{- include "umer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agent
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # NATS / Redis / Postgres / MinIO / OTel inside cluster
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 4318
    # Extension worker only for tool egress path
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: extension
{{- end }}
