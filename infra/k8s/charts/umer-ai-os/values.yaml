# Default values for umer-ai-os.
imageRegistry: ''
imageTag: local
imagePullPolicy: IfNotPresent

global:
  env:
    NODE_ENV: production
    LOG_LEVEL: info
    DATABASE_URL: postgres://umer:umer@postgres:5432/umer_ai_os
    REDIS_URL: redis://redis:6379
    NATS_URL: nats://nats:4222
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin
    S3_BUCKET_ARTIFACTS: umer-artifacts
    S3_FORCE_PATH_STYLE: 'true'
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    HEALTH_PORT: '8080'

apps:
  web:
    enabled: true
    image: umer-web
    replicas: 1
    port: 3000
    servicePort: 3000
  gateway:
    enabled: true
    image: umer-gateway
    appName: api-gateway
    replicas: 1
    port: 4080
    servicePort: 4080
  controlApi:
    enabled: true
    image: umer-control-api
    appName: control-api
    replicas: 1
    port: 4000
    servicePort: 4000
  orchestration:
    enabled: true
    image: umer-orchestration
    appName: orchestration-worker
    replicas: 1
    healthPort: 8080
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
  agent:
    enabled: true
    image: umer-agent
    appName: agent-worker
    replicas: 1
    healthPort: 8080
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
  extension:
    enabled: true
    image: umer-extension
    appName: extension-worker
    replicas: 1
    healthPort: 8080
  audit:
    enabled: true
    image: umer-audit
    appName: audit-sink
    replicas: 1
    healthPort: 8080

ingress:
  enabled: false
  className: nginx
  host: umer.local
  tls: false

networkPolicy:
  agentEgressRestrict: true
