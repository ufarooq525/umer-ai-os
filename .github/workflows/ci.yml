name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # MySQL backs the durable Opportunity Intelligence / Revenue OS tests
    # (e.g. packages/opportunity-intelligence/src/e2e-mysql-flow.test.ts) —
    # these run against a real database, not a mock, matching this repo's
    # zero-fabrication testing philosophy. Credentials/db name match
    # infra/docker/docker-compose.yml exactly, which is also what
    # packages/config's OPPORTUNITY_DATABASE_URL default already points at,
    # so no extra env wiring is needed for the test run below.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: umer_root
          MYSQL_DATABASE: umer_revenue_os
          MYSQL_USER: umer_revenue
          MYSQL_PASSWORD: umer_revenue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uumer_revenue -pumer_revenue --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  images:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-api
            file: infra/docker/Dockerfile.worker
            args: APP_NAME=control-api
          - name: api-gateway
            file: infra/docker/Dockerfile.worker
            args: APP_NAME=api-gateway
          - name: orchestration-worker
            file: infra/docker/Dockerfile.worker
            args: APP_NAME=orchestration-worker
          - name: agent-worker
            file: infra/docker/Dockerfile.worker
            args: APP_NAME=agent-worker
          - name: extension-worker
            file: infra/docker/Dockerfile.worker
            args: APP_NAME=extension-worker
          - name: audit-sink
            file: infra/docker/Dockerfile.worker
            args: APP_NAME=audit-sink
          - name: web
            file: infra/docker/Dockerfile.web
            args: ''
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: umer-${{ matrix.name }}:ci
          build-args: ${{ matrix.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: umer-${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint Helm chart
        run: helm lint infra/k8s/charts/umer-ai-os
      - name: Render Helm templates
        run: helm template umer infra/k8s/charts/umer-ai-os > /tmp/umer-rendered.yaml
